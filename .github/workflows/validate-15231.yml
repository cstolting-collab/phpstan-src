name: Validate #15231

on:
  push:
    branches:
      - fix/15231-parser-cache-routing
      - validate/15231-red

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          extensions: ds,mbstring
          ini-values: memory_limit=-1
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - name: Run focused parser-cache regression
        run: vendor/bin/phpunit tests/PHPStan/Parser/CachedParserTest.php --filter testParseFileDoesNotReuseCleanedAstForAnalysedFileWithSameContents
